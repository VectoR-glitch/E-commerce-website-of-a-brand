<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#1F3D2B"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="#B08D4C" stroke-opacity="0.55" stroke-width="2"/>
  <g stroke="#F5F1E8" stroke-linecap="butt" fill="none">
    <!-- stem (thick) -->
    <path d="M24 17 L24 47" stroke-width="7"/>
    <!-- upper arm + lower leg (thinner, meeting the stem at mid-height) -->
    <path d="M25 32 L46 17" stroke-width="5.5"/>
    <path d="M25 32 L47 47" stroke-width="5.5"/>
  </g>
  <g fill="#F5F1E8">
    <!-- serif feet: stem top/bottom + arm top + leg bottom -->
    <rect x="16.5" y="15" width="15" height="3.5"/>
    <rect x="16.5" y="45.5" width="15" height="3.5"/>
    <rect x="40" y="15" width="11" height="3.5"/>
    <rect x="40" y="45.5" width="11" height="3.5"/>
  </g>
</svg>
